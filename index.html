<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GemCraft Lite Prototype</title>
    <style>
        body { background: #1a1a1a; color: #eee; font-family: sans-serif; display: flex; margin: 0; overflow: hidden; }
        #game-container { position: relative; }
        canvas { background: #000; cursor: crosshair; border-right: 2px solid #333; }
        #sidebar { width: 250px; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #222; }
        .gem-btn { padding: 10px; border: none; cursor: pointer; color: white; font-weight: bold; border-radius: 4px; transition: 0.2s; }
        .gem-btn:hover { opacity: 0.8; transform: scale(1.05); }
        .mana-display { font-size: 24px; color: #4af; text-shadow: 0 0 10px #04f; margin-bottom: 10px; }
        #menu { position: absolute; display: none; background: rgba(0,0,0,0.9); border: 1px solid #555; padding: 10px; border-radius: 5px; z-index: 100; }
        #menu button { display: block; width: 100%; margin: 5px 0; padding: 8px; cursor: pointer; background: #444; color: white; border: none; }
        #menu button:hover { background: #666; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="800" height="600"></canvas>
    <div id="menu">
        <button onclick="handleMenu('upgrade')">升级 (Cost: <span id="up-cost"></span>)</button>
        <button onclick="handleMenu('destroy')">摧毁 (回收魔力)</button>
        <button onclick="handleMenu('cancel')">取消</button>
    </div>
</div>

<div id="sidebar">
    <div class="mana-display">Mana: <span id="mana">500</span></div>
    <div style="font-size: 12px; color: #888;">点击创建宝石 (100 Mana)</div>
    <button class="gem-btn" style="background: #ff4d4d;" onclick="createGem('RED')">红 (溅射)</button>
    <button class="gem-btn" style="background: #4da6ff;" onclick="createGem('BLUE')">蓝 (减速)</button>
    <button class="gem-btn" style="background: #ffa500;" onclick="createGem('ORANGE')">橙 (回蓝)</button>
    <button class="gem-btn" style="background: #ffff4d; color: #000;" onclick="createGem('YELLOW')">黄 (暴击)</button>
    <button class="gem-btn" style="background: #4dff4d; color: #000;" onclick="createGem('GREEN')">绿 (毒伤)</button>
    <button class="gem-btn" style="background: #b366ff;" onclick="createGem('PURPLE')">紫 (破甲)</button>
    <hr style="width:100%; border-color:#444">
    <div style="font-size: 12px; color: #888;">按住拖拽宝石至基座</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const manaEl = document.getElementById('mana');
const menu = document.getElementById('menu');

// --- 游戏配置 ---
let state = {
    mana: 800,
    inventory: [], // 侧边栏/备用区的宝石
    buildings: [
        { x: 200, y: 300, type: 'TOWER', gem: null },
        { x: 400, y: 300, type: 'AMPLIFIER', gem: null },
        { x: 300, y: 450, type: 'TRAP', gem: null }
    ],
    enemies: [],
    draggingGem: null,
    selectedBuilding: null,
    frame: 0
};

const COLORS = { RED:'#ff4d4d', BLUE:'#4da6ff', ORANGE:'#ffa500', YELLOW:'#ffff4d', GREEN:'#4dff4d', PURPLE:'#b366ff', MIXED:'#eee' };

// --- 宝石类 ---
class Gem {
    constructor(type, level = 1) {
        this.level = level;
        this.components = { [type]: 1 };
        this.color = COLORS[type];
        this.x = 0; this.y = 0; // 仅用于拖拽视觉
    }

    getStats() {
        let l = this.level;
        let c = this.components;
        return {
            dmg: 10 * Math.pow(1.6, l-1),
            range: 120 + l * 10,
            splash: (c.RED || 0) * 40 * l,
            slow: (c.BLUE || 0) * 0.2 * l,
            manaG: (c.ORANGE || 0) * 5 * l,
            crit: (c.YELLOW || 0) * 0.15,
            poison: (c.GREEN || 0) * 10 * l,
            shred: (c.PURPLE || 0) * 2 * l
        };
    }
}

// --- 核心逻辑 ---
function createGem(type) {
    if (state.mana >= 100) {
        state.mana -= 100;
        let gem = new Gem(type);
        state.inventory.push(gem);
        updateUI();
    }
}

function combine(g1, g2) {
    let newLevel = Math.max(g1.level, g2.level) + (g1.level === g2.level ? 1 : 0);
    let newGem = new Gem('MIXED', newLevel);
    // 混合组件
    for (let k in g1.components) newGem.components[k] = (newGem.components[k] || 0) + 0.5;
    for (let k in g2.components) newGem.components[k] = (newGem.components[k] || 0) + 0.5;
    return newGem;
}

// --- 交互系统 ---
canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // 检查是否点击了建筑上的宝石
    state.buildings.forEach(b => {
        if (Math.hypot(b.x - mx, b.y - my) < 25 && b.gem) {
            state.selectedBuilding = b;
            showMenu(e.clientX, e.clientY, b.gem);
        }
    });

    // 简易备用区选择（这里演示逻辑：点击画布空白处抓取最后创建的宝石）
    if (!state.selectedBuilding && state.inventory.length > 0) {
        state.draggingGem = state.inventory.pop();
    }
};

canvas.onmousemove = (e) => {
    if (state.draggingGem) {
        const rect = canvas.getBoundingClientRect();
        state.draggingGem.x = e.clientX - rect.left;
        state.draggingGem.y = e.clientY - rect.top;
    }
};

canvas.onmouseup = (e) => {
    if (!state.draggingGem) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let placed = false;
    state.buildings.forEach(b => {
        if (Math.hypot(b.x - mx, b.y - my) < 30) {
            if (!b.gem) {
                b.gem = state.draggingGem;
            } else {
                b.gem = combine(b.gem, state.draggingGem);
            }
            placed = true;
        }
    });

    if (!placed) state.inventory.push(state.draggingGem);
    state.draggingGem = null;
};

// --- 菜单功能 ---
function showMenu(x, y, gem) {
    menu.style.display = 'block';
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    document.getElementById('up-cost').innerText = Math.round(100 * Math.pow(2.2, gem.level));
}

function handleMenu(action) {
    let b = state.selectedBuilding;
    if (action === 'upgrade') {
        let cost = Math.round(100 * Math.pow(2.2, b.gem.level));
        if (state.mana >= cost) {
            state.mana -= cost;
            b.gem.level++;
        }
    } else if (action === 'destroy') {
        state.mana += 50 * b.gem.level;
        b.gem = null;
    }
    menu.style.display = 'none';
    state.selectedBuilding = null;
    updateUI();
}

// --- 渲染循环 ---
function draw() {
    ctx.clearRect(0, 0, 800, 600);
    
    // 1. 绘制基座
    state.buildings.forEach(b => {
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 2;
        if (b.type === 'TRAP') {
            ctx.strokeRect(b.x-20, b.y-20, 40, 40);
            ctx.fillText("TRAP", b.x-15, b.y+35);
        } else {
            ctx.beginPath(); ctx.arc(b.x, b.y, 25, 0, Math.PI*2); ctx.stroke();
            ctx.fillText(b.type === 'TOWER' ? "MAIN" : "AMP", b.x-15, b.y+40);
        }

        if (b.gem) drawGem(b.x, b.y, b.gem);
    });

    // 2. 绘制拖拽中的宝石
    if (state.draggingGem) drawGem(state.draggingGem.x, state.draggingGem.y, state.draggingGem);

    // 3. 模拟简单的攻击视觉 (仅用于演示)
    state.frame++;
    requestAnimationFrame(draw);
}

function drawGem(x, y, gem) {
    ctx.shadowBlur = 15;
    ctx.shadowColor = gem.color;
    ctx.fillStyle = gem.color;
    ctx.beginPath();
    // 等级越高，多边形边数越多
    let sides = 3 + gem.level;
    for(let i=0; i<=sides; i++) {
        let angle = i * 2 * Math.PI / sides;
        ctx.lineTo(x + 12 * Math.cos(angle), y + 12 * Math.sin(angle));
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#000";
    ctx.font = "bold 10px Arial";
    ctx.fillText(gem.level, x-3, y+4);
}

function updateUI() {
    manaEl.innerText = Math.floor(state.mana);
}

// 启动
setInterval(() => { state.mana += 0.5; updateUI(); }, 100); // 自动回蓝
draw();
</script>
</body>
</html>
