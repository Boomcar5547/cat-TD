<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GemCraft Hex Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="800" height="600"></canvas>
        
        <div id="build-menu" class="hidden">
            <button onclick="buildBuilding('TOWER')">建造 塔基座 (Tower)</button>
            <button onclick="buildBuilding('AMP')">建造 增幅器 (Amplifier)</button>
            <button onclick="closeMenu()" class="cancel-btn">取消</button>
        </div>
    </div>

    <div id="sidebar">
        <h3>六边形网格引擎</h3>
        <p>1. 点击深灰色【可建造区】选择建造基座或增幅器。</p>
        <p>2. 塔基座为圆形，增幅器为齿轮状。</p>
        <p>3. 道路（褐色）仅可放置陷阱。</p>
        <button onclick="clearBuildings()">清空地图</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
